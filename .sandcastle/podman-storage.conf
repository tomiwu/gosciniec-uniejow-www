# Own podman store for the gosciniec-uniejow-www Sandcastle loop.
# scripts/start-loop.sh and scripts/build-image.sh set CONTAINERS_STORAGE_CONF to this file.
# Reason (2026-11-27): after a box replacement, the shared store ~/.local/share/containers had
# damaged layers (images without /tmp). An own store can be deleted and rebuilt safely.
# Rootless podman ignores "graphroot"; it uses "rootless_storage_path".
[storage]
driver = "overlay"
rootless_storage_path = "/home/box/.local/share/containers-gosciniec-www/storage"
