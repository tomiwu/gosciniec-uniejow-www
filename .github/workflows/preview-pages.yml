# Preview of the site on GitHub Pages: https://tomiwu.github.io/gosciniec-uniejow-www/
# Temporary. Not the production site (webd.pl). The preview build has a base path, a visible
# "PODGLĄD" banner, noindex meta tags and robots.txt "Disallow: /". The PHP form endpoint does not run here.
name: Preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_PREVIEW: '1'
          NEXT_PUBLIC_BASE_PATH: /gosciniec-uniejow-www
      - run: rm -f out/.htaccess && touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
